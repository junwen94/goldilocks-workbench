# The uv workspace root (D1): one lock for the four packages under packages/, and the settings of the Python
# checks that tools/check.sh runs. The root is virtual: it is not a package and is never installed.

[tool.uv.workspace]
members = ["packages/workbench", "packages/chat", "packages/ada", "packages/agent"]

[tool.uv]
required-version = ">=0.12.9,<0.14"
# The forms run on macOS (the app, D21) and Linux (the container and the website, D20); the lock covers only these.
# The operating system of Ada's VMs is not known yet; the Ada-platform spike S10 records it (ada plan).
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[dependency-groups]
dev = [
  # Spikes only (S1 compares ChatOllama with ChatLiteLLM); never a runtime dependency of a form.
  "langchain-ollama~=1.2.0",
  # Spikes only (S4 restarts the server on the SQLite checkpointer); M2 adds it to the forms when it builds the store.
  "langgraph-checkpoint-sqlite~=3.1.3",
  "mypy~=2.4.1",
  "pytest~=9.2.0",
  "ruff~=0.17.6",
  # Spikes only (S2 runs a FastAPI app under it); M2 adds it to the forms when it builds the server.
  "uvicorn~=0.54.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["goldilocks_ada", "goldilocks_agent", "goldilocks_chat", "goldilocks_workbench"]

[tool.mypy]
strict = true
python_version = "3.12"
# spikes/S1 to spikes/S4 hold scripts that import each other by plain name (s1_common, ...), as they run.
mypy_path = ["packages/workbench/src", "packages/chat/src", "packages/ada/src", "packages/agent/src", "spikes/S1", "spikes/S2", "spikes/S3", "spikes/S4"]
explicit_package_bases = true
files = ["packages", "tools/checks", "spikes"]

[tool.pytest.ini_options]
testpaths = ["packages", "tools/checks/tests", "spikes"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
  "live: needs a real model, cluster or live service; never runs in CI, the owner runs it and records the result",
]
