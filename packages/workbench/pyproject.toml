[project]
name = "goldilocks-workbench"
version = "0.0.0"
description = "The shared part of Goldilocks Workbench: tools, model layer, server kit and store (D1)."
license = "BSD-3-Clause"
requires-python = ">=3.12,<3.13"
# Direct dependencies pin the minor version (plan, risk 5); uv.lock pins the rest. No AiiDA, Deep Agents or MLIP
# package here: goldilocks-chat and goldilocks-ada depend on this package (AGENTS.md, rule 4; ada D8;
# tools/checks/light_env.py).
dependencies = [
  "fastapi~=0.165.0",
  "langchain-litellm~=0.4.0",
  "pydantic~=2.14.4",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"
