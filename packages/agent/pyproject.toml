[project]
name = "goldilocks-agent"
version = "0.0.0"
description = "goldilocks-agent, the form of Goldilocks Workbench that runs DFT and MLIP studies through AiiDA (D1, D4)."
license = "BSD-3-Clause"
requires-python = ">=3.12,<3.13"
# Direct dependencies pin the minor version (plan, risk 5); uv.lock pins the rest.
dependencies = [
  "goldilocks-workbench",
  # 2.9 brought the built-in ZeroMQ broker that the app runs with SQLite storage (D21.3).
  "aiida-core~=2.9.4",
  "aiida-quantumespresso~=5.1.0",
  "aiida-pseudo~=1.11.0",
  # The newest release that installs with aiida-core 2.9, which the owner kept on 2026-11-26 for SQLite with the
  # ZeroMQ broker (D21.3; plan, "aiida-core and aiida-mlip versions"). Checked 2026-11-26: aiida-mlip 0.5.0 requires
  # aiida-core~=2.7.4, and 0.4.1 requires aiida-workgraph 0.7, which requires aiida-core below 2.8. aiida-mlip's main
  # branch (0a7becb, 2026-10-26) requires aiida-core~=2.8 and resolves with aiida-core 2.9.4, aiida-workgraph 0.9.0,
  # janus-core 0.9.9 and numpy 2; it is not released. Move up when a release supports aiida-core 2.9
  # (ddmms/goldilocks-workbench#2). S5 tests this version. What 0.3.0 brings with it (checked 2026-11-26):
  # - janus-core below 0.8 (0.7.6 in the lock), not the 0.9.9 that D41 cites;
  # - numpy below 2 for the whole workspace, chat included, because janus-core 0.7.6 and aiida-workgraph 0.5.3 both
  #   require it;
  # - aiida-workgraph 0.5.3, which declares no upper bound on aiida-core but does not import with aiida-core 2.9.4:
  #   its dependency aiida-pythonjob 0.2.5 imports `get_stack_size`, which aiida-core 2.9.4 does not have. So
  #   aiida-mlip's workgraph workflow (`aiida_mlip.workflows.ht_workgraph`) cannot be used. Its calculations and
  #   data types can; tests/test_dependencies.py checks that they load.
  "aiida-mlip~=0.3.0",
  "deepagents~=0.7.42",
  "langgraph~=1.2.24",
]

[project.scripts]
goldilocks-agent = "goldilocks_agent.cli:main"

[tool.uv.sources]
goldilocks-workbench = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"
