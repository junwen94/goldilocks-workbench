[project]
name = "goldilocks-chat"
version = "0.0.0"
description = "goldilocks-chat, the website form of Goldilocks Workbench (D1, D3)."
license = "BSD-3-Clause"
requires-python = ">=3.12,<3.13"
# Never AiiDA, Deep Agents, MLIP packages or goldilocks-agent (AGENTS.md, rule 4; tools/checks/chat_env.py).
dependencies = [
  "goldilocks-workbench",
]

[project.scripts]
goldilocks-chat = "goldilocks_chat.cli:main"

[tool.uv.sources]
goldilocks-workbench = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.9,<0.14"]
build-backend = "uv_build"
